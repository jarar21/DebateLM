<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DebateLM</title>
    <style>
      /* Dark background prevents white flash during loading */
      html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #121212; }
      iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
  </head>
  <body>
    <script>
      // 1. Check if the user already has a guest ID saved on debatelm.com
      let guestId = localStorage.getItem("debatelm_guest_id");
      
      // 2. If they are a new visitor, generate a permanent ID
      if (!guestId) {
        // Generates a random string like "guest_x7f9..."
        guestId = "guest_" + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        localStorage.setItem("debatelm_guest_id", guestId);
      }
      
      // 3. Dynamically create the Streamlit iframe and inject the Guest ID!
      const iframe = document.createElement("iframe");
      
      // We pass the guestId securely into the Streamlit URL
      iframe.src = "https://debatelm.streamlit.app/?embed=true&uid=" + guestId;
      
      // Security and formatting tags
      iframe.setAttribute("allowfullscreen", "");
      iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-forms allow-downloads");
      
      document.body.appendChild(iframe);
    </script>
  </body>
</html>
