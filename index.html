<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- This meta tag is strictly required for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>DebateLM</title>
    <style>
      /* Reset margins and paddings, and ensure the body takes exactly 100% of the screen */
      html, body { 
        margin: 0; 
        padding: 0; 
        width: 100vw; 
        height: 100vh; 
        overflow: hidden; 
        background-color: #ffffff; /* Optional: prevents flashing before load */
      }
      
      /* Make the iframe take up the entire viewport */
      iframe { 
        width: 100%; 
        height: 100%; 
        border: none; 
        display: block; /* Removes default inline spacing underneath iframes */
      }
    </style>
  </head>
  <body>
    <script>
      // Generate or retrieve the permanent Guest ID
      let guestId = localStorage.getItem("debatelm_guest_id");
      if (!guestId) {
        guestId = "guest_" + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        localStorage.setItem("debatelm_guest_id", guestId);
      }

      // Create your exact iframe and inject the ID into your URL
      const iframe = document.createElement("iframe");
      
      // Kept your exact URL and appended the uid parameter
      iframe.src = "https://debatelm.streamlit.app//?embedded=true&uid=" + guestId;
      
      // Kept your exact attributes
      iframe.setAttribute("allowfullscreen", "");
      iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-forms");
      
      document.body.appendChild(iframe);
    </script>
  </body>
</html>
