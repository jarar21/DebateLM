<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DebateLM</title>
    <style>
      /* Dark background prevents white flash during loading */
      html, body { 
        margin: 0; 
        padding: 0; 
        width: 100vw; 
        height: 100vh; 
        overflow: hidden; /* Hides anything that bleeds off the screen */
        background-color: #121212; 
      }
      
      /* THE MAGIC HACK: We make the iframe 55px taller than the screen! 
         This pushes the "Built with Streamlit" footer below the visible monitor line */
      iframe { 
        width: 100%; 
        height: calc(100vh + 55px); 
        border: none; 
        display: block; 
      }
    </style>
  </head>
  <body>
    <script>
      let guestId = localStorage.getItem("debatelm_guest_id");
      
      if (!guestId) {
        guestId = "guest_" + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        localStorage.setItem("debatelm_guest_id", guestId);
      }
      
      const iframe = document.createElement("iframe");
      
      // We added "&embed_options=dark_theme" to fix the white flash!
      iframe.src = "https://debatelm.streamlit.app/?embed=true&embed_options=dark_theme&uid=" + guestId;
      
      iframe.setAttribute("allowfullscreen", "");
      iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-forms allow-downloads");
      
      document.body.appendChild(iframe);
    </script>
  </body>
</html>
