<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DebateLM</title>
    <style>
      html, body { 
        margin: 0; 
        padding: 0; 
        width: 100vw; 
        height: 100vh; 
        overflow: hidden; 
        background-color: #121212; 
      }
      
      iframe { 
        width: 100%; 
        height: 100%; 
        border: none; 
        display: block; 
      }
    </style>
  </head>
  <body>
    <script>
      let guestId = localStorage.getItem("debatelm_guest_id");
      
      if (!guestId) {
        guestId = "guest_" + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        localStorage.setItem("debatelm_guest_id", guestId);
      }
      
      const iframe = document.createElement("iframe");
      
      // THE FIX: We put embed=true back to stop the crash, 
      // but added "show_toolbar" to bring back the top-right menu!
      iframe.src = "https://debatelm.streamlit.app/?embed=true&embed_options=show_toolbar,dark_theme&uid=" + guestId;
      
      iframe.setAttribute("allowfullscreen", "");
      iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-forms allow-downloads");
      
      document.body.appendChild(iframe);
    </script>
  </body>
</html>
